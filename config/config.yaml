  alignment:
    k_values:         [5, 10, 20, 50]
    headline_k:       10
    n_samples:        [1000, 5000, 20000, 100000]
    anchor_sizes:     [256, 1024, 4096]
    headline_anchors: 1024
    cka_rbf_n_subsample: 2000
    results_base_dir: "${outputs_root}"
    consensus_dir:    "${outputs_root}/consensus"
    e1_pools:   [cxr_pool]
    e2_pools:   [cxr_pool]
    e3_pools:   [cxr_pool]
    e4_pools:   [cxr_pool]
    e6_pools:   [cxr_pool]
    e1_roles:   [core]
    e4_roles:   [ladder, core]
    xmod_roles: [xmod, core]

  controlled:
    ckpts_dir:         "${outputs_root}/controlled_ckpts"
    results_e5_dir:    "${outputs_root}/results_e5_driver"
    objectives:        [ssl, supervised, image_text]
    backbones:         [vit_s, vit_b]
    inits:             [dinov3_s]
    modalities:        [cxr, histo]
    cxr_n_labels:      13
    histo_n_classes:   9
    epochs:            50
    batch_size:        256
    effective_batch_size: 512
    lr:                0.0001
    weight_decay:      0.05
    warmup_fraction:   0.1
    n_seeds:           1
    n_boot_alignment:  1000
    ssl_method:        mae
    mae_mask_ratio:    0.75
    clip_temp:         0.07
    bf16:              true
    gradient_checkpointing: true

  reader_study:
    n_gold_r1:          500
    n_triplets_r1:      300
    n_overlap_r2:       150
    n_triplet_overlap_r2: 100
    n_extension_r2:     150
    gold_csv:            "${outputs_root}/results_e7_artifact/reader/gold_labels.csv"
    triplets_csv:        "${outputs_root}/results_e3_ontology/reader/triplets.csv"
