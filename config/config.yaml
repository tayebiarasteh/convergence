ocean_root:    /PATH
home_root:     /PATH
user_home:     /PATH

datasets_root: "${ocean_root}/datasets"
xray_root:     "${datasets_root}/XRay"
outputs_root:  "${ocean_root}/Repositories_target_files/convergence"
repo_root:     "${home_root}/Repositories/convergence"
manifests_dir: "${repo_root}/data_loader"

Convergence:
  global_config_path: "${repo_root}/config/config.yaml"
  seed: 42
  target_resolution: 224

  hf_token: "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"

  datasets_root: "${datasets_root}"
  xray_root:     "${xray_root}"
  outputs_root:  "${outputs_root}"
  repo_root:     "${repo_root}"
  manifests_dir: "${manifests_dir}"

  cxr:
    pool_manifest_csv:  "${manifests_dir}/cxr_pool_manifest.csv"
    paired_reports_csv: "${manifests_dir}/cxr_paired_reports_manifest.csv"

    verify_image_exists: true
    cap_per_site_view:   null
    drop_lateral:        true

    reports:
      sources: [mimic, chexpert_plus]
      use_sections: [section_findings, section_impression]

    sites:
      mimic:
        enabled:        true
        image_root:     "${xray_root}/MIMIC"
        master_csv:     "${xray_root}/MIMIC/mimic_master_list.csv"
        split_col:      split
        subject_id_col: subject_id
        study_id_col:   study_id
        age_col:        age
        sex_col:        gender
        report_col:     report_rel_path
        report_is_text: false
        chexpert_plus_csv: null

      chexpert:
        enabled:        true
        image_root:     "${xray_root}"
        master_csv:     "${xray_root}/CheXpert-v1.0/chexpert_master_list.csv"
        split_col:      split
        subject_id_col: subject_id
        study_id_col:   null
        age_col:        age
        sex_col:        gender
        report_col:     null
        report_is_text: false
        chexpert_plus_csv:  "${xray_root}/CheXpert-v1.0/chexpert_plus.csv"
        report_join_col:    jpg_rel_path
        race_col:           race
        ethnicity_col:      ethnicity
        insurance_col:      insurance_type

      vindr_cxr:
        enabled:        true
        image_root:     "${xray_root}/vindr-cxr1"
        master_csv:     "${xray_root}/vindr-cxr1/vindr_master_list.csv"
        split_col:      split
        subject_id_col: null
        study_id_col:   null
        age_col:        age
        sex_col:        gender
        report_col:     null
        report_is_text: false
        chexpert_plus_csv: null

      nih_cxr14:
        enabled:        true
        image_root:     "${xray_root}/NIH_ChestX-ray14"
        master_csv:     "${xray_root}/NIH_ChestX-ray14/final_cxr14_master_list.csv"
        split_col:      split
        subject_id_col: patient_id
        study_id_col:   null
        age_col:        age
        sex_col:        gender
        report_col:     null
        report_is_text: false
        chexpert_plus_csv: null

      padchest:
        enabled:        true
        image_root:     "${xray_root}/padchest"
        master_csv:     "${xray_root}/padchest/padchest_master_list_20percenttest.csv"
        split_col:      split
        subject_id_col: PatientID
        study_id_col:   StudyID
        age_col:        age
        sex_col:        gender
        report_col:     null
        report_is_text: false
        chexpert_plus_csv: null

      vindr_pcxr:
        enabled:        true
        image_root:     "${xray_root}/vindr-pcxr"
        master_csv:     "${xray_root}/vindr-pcxr/final_modified_vindr-pcxr.csv"
        split_col:      split
        subject_id_col: null
        study_id_col:   null
        age_col:        null
        sex_col:        null
        report_col:     null
        report_is_text: false
        chexpert_plus_csv: null

  histo:
    pool_manifest_csv:   "${manifests_dir}/histo_pool_manifest.csv"
    nct_crc_labels_csv:  "${manifests_dir}/nct_crc_labels.csv"
    output_resolution:   224
    cases_per_class:     2000

    pcam:
      enabled:               true
      h5_dir:                "${datasets_root}/Histo/PCam"
      split:                 test
      patches_subdir:        patches
      extract_cap_per_class: null

    nct_crc:
      enabled:             true
      root:                "${datasets_root}/Histo/NCT-CRC-HE-100K"
      train_subdir:        NCT-CRC-HE-100K
      val_subdir:          CRC-VAL-HE-7K
      classes: [ADI, BACK, DEB, LYM, MUC, MUS, NORM, STR, TUM]


  quilt:
    enabled:           true
    root:              "${datasets_root}/Histo/Quilt-1M"
    lookup_csv:        "${datasets_root}/Histo/Quilt-1M/quilt_1M_lookup.csv"
    images_subdir:     extracted_images
    pool_manifest_csv: "${manifests_dir}/quilt_pool_manifest.csv"
    image_col:         image_path
    caption_col:       caption
    split_col:         split
    split:             train
    cases_cap:         null

  fundus:
    enabled:           true
    image_root:        "${datasets_root}/Fundus"
    pool_manifest_csv: "${manifests_dir}/fundus_pool_manifest.csv"
    cases_per_source:  2000
    referable_dr_min:  2
    sources:
      aptos:
        master_csv:  "${datasets_root}/Fundus/APTOS2019/train.csv"
        source_tag:  aptos
        id_col:      id_code
        label_col:   diagnosis
      messidor:
        master_csv:  "${datasets_root}/Fundus/Messidor2/messidor_data.csv"
        source_tag:  messidor
        id_col:      image_id
        label_col:   adjudicated_dr_grade
        gradable_col: adjudicated_gradable

  derm:
    enabled:           true
    image_root:        "${datasets_root}/Derm"
    pool_manifest_csv: "${manifests_dir}/derm_pool_manifest.csv"
    cases_per_class:   1000
    sources:
      isic2019:
        gt_csv:     "${datasets_root}/Derm/ISIC2019/ISIC_2019_Training_GroundTruth.csv"
        source_tag: isic2019
        id_col:     image
        classes:    [MEL, NV, BCC, AK, BKL, DF, VASC, SCC]
        class_map:
          MEL:  melanoma
          NV:   melanocytic_nevus
          BCC:  basal_cell_carcinoma
          AK:   actinic_keratosis
          BKL:  benign_keratosis
          DF:   dermatofibroma
          VASC: vascular_lesion
          SCC:  squamous_cell_carcinoma

  mammo:
    enabled:           true
    image_root:        "${datasets_root}/Mammo/VinDr-Mammo"
    pool_manifest_csv: "${manifests_dir}/mammo_pool_manifest.csv"
    cases_per_finding: 500
    findings_csv:      "${datasets_root}/Mammo/VinDr-Mammo/finding_annotations.csv"
    image_subdir:      images
    preprocessed_subdir: preprocessed224
    usable_findings:   [mass, suspicious_calcification, focal_asymmetry, architectural_distortion, asymmetry]
    category_map:
      "Mass":                     mass
      "Suspicious Calcification": suspicious_calcification
      "Focal Asymmetry":          focal_asymmetry
      "Architectural Distortion": architectural_distortion
      "Asymmetry":                asymmetry

  prevalence:
    out_csv: "${outputs_root}/prevalence/cxr_prevalence.csv"

  ontology:
    icd10_order_txt:    "${datasets_root}/ontology/ICD10/icd10cm_order_2027.txt"
    icd10_distance_csv: "${outputs_root}/ontology/icd10_finding_distance.csv"
    comorbidity_csv:    "${outputs_root}/ontology/cxr_comorbidity.csv"

  embeddings:
    output_dir:      "${outputs_root}/embeddings"
    text_output_dir: "${outputs_root}/text_embeddings"
    batch_size:   64
    num_workers:  4
    fp16:         true
    purge_hf_cache_after_use: true
    hf_cache_dir: "${user_home}/.cache/huggingface/hub"
    consensus_max_cases: 50000
    probe_max_train: 25000
    probe_max_test: 20000
    pools:
      cxr_pool:    {manifest: "${manifests_dir}/cxr_pool_manifest.csv",    modality: cxr}
      histo_pool:  {manifest: "${manifests_dir}/histo_pool_manifest.csv",  modality: histo}
      fundus_pool: {manifest: "${manifests_dir}/fundus_pool_manifest.csv", modality: fundus}
      derm_pool:   {manifest: "${manifests_dir}/derm_pool_manifest.csv",   modality: derm}
      mammo_pool:  {manifest: "${manifests_dir}/mammo_pool_manifest.csv",  modality: mammo}
      quilt_pool:  {manifest: "${manifests_dir}/quilt_pool_manifest.csv",  modality: histo}

  encoder_panel:
    image:
      rad_dino:
        hf_id: microsoft/rad-dino
        type: dino_cls
        dim: 768
        params_m: 86
        year: 2024
        roles: [core, cxr]
      biomedclip_image:
        hf_id: microsoft/BiomedCLIP-PubMedBERT_256-vit_base_patch16_224
